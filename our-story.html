    <!-- Self-hosted fonts: an external Google Fonts stylesheet link blocks the
         first paint on its own network round trip before the browser even
         discovers the font files. Inlining @font-face here removes that hop
         entirely. Deliberately NOT using <link rel="preload"> for these —
         measured with Lighthouse, preloading multiple fonts here made LCP
         worse (4.5s vs 3.3s), not better: on a throttled connection it made
         all four font files compete for bandwidth with the JS bundle at
         once instead of loading in the browser's own natural priority
         order. Leave this as plain @font-face unless re-measured. -->
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/bricolage-grotesque.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/newsreader.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url("/fonts/fraunces-800.woff2") format("woff2");
      }
      @font-face {
        font-family: "Karla";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/karla.woff2") format("woff2");
      }
    </style>

    <!-- Structured data (JSON-LD) is rendered by <StructuredData> in the React
         tree — src/components/seo/StructuredData.tsx — so the menu section
         of the schema is generated from the same DISHES data the page
         itself renders, instead of a second hand-maintained copy here. -->
  </head>
